name: IobBot Controller Watchdog

on:
  workflow_dispatch:

  schedule:
    # every 3 hours
    - cron: '0 */3 * * *'

jobs:
  iobbot-controller-watchdog:
    name: iobbot controller watchdog
    if: |
      github.repository == 'iobroker-bot-orga/iobbot-controller'

    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Check and start starter workflow if needed
        run: |
          set -euo pipefail

          REPO="iobroker-bot-orga/iobbot-controller"
          WORKFLOW_FILE="iobbotControllerStarter.yml"
          THRESHOLD_SECONDS=1800

          RUNNING_COUNT=$(gh run list --repo "$REPO" --workflow "$WORKFLOW_FILE" --status in_progress --json databaseId --jq 'length')
          QUEUED_COUNT=$(gh run list --repo "$REPO" --workflow "$WORKFLOW_FILE" --status queued --json databaseId --jq 'length')

          if [ "$RUNNING_COUNT" -gt 0 ] || [ "$QUEUED_COUNT" -gt 0 ]; then
            echo "IobBot Controller Starter is currently running or queued (running=$RUNNING_COUNT, queued=$QUEUED_COUNT). Watchdog exits successfully."
            exit 0
          fi

          LAST_RUN_CREATED_AT=$(gh run list --repo "$REPO" --workflow "$WORKFLOW_FILE" --limit 1 --json createdAt --jq '.[0].createdAt // empty')

          if [ -z "$LAST_RUN_CREATED_AT" ]; then
            echo "No previous run found for $WORKFLOW_FILE. Triggering a new run."
            if gh workflow run "$WORKFLOW_FILE" --repo "$REPO"; then
              echo "Successfully triggered $WORKFLOW_FILE."
              exit 0
            else
              echo "Failed to trigger $WORKFLOW_FILE."
              exit 1
            fi
          fi

          NOW_EPOCH=$(date -u +%s)
          LAST_RUN_EPOCH=$(date -u -d "$LAST_RUN_CREATED_AT" +%s)
          AGE_SECONDS=$((NOW_EPOCH - LAST_RUN_EPOCH))
          AGE_MINUTES=$((AGE_SECONDS / 60))

          if [ "$AGE_SECONDS" -gt "$THRESHOLD_SECONDS" ]; then
            echo "Last run of $WORKFLOW_FILE is $AGE_MINUTES minutes old (>30). Triggering a new run."
            if gh workflow run "$WORKFLOW_FILE" --repo "$REPO"; then
              echo "Successfully triggered $WORKFLOW_FILE."
              exit 0
            else
              echo "Failed to trigger $WORKFLOW_FILE."
              exit 1
            fi
          fi

          echo "Last run of $WORKFLOW_FILE is $AGE_MINUTES minutes old (<=30). No action needed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
